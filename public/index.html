<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Octane 3D Voice (LiveKit Cloud)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #0d1117;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            text-align: center;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #238636;
            color: #ffffff;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #fff;
        }
        p.subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #58a6ff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary {
            background: #238636;
            color: white;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-mute {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            margin-top: 14px;
        }
        .btn-mute.muted {
            background: #da3633;
            border-color: #f85149;
        }
        .status-panel {
            margin-top: 20px;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #da3633;
            margin-right: 6px;
        }
        .indicator.active {
            background: #2ea043;
        }
        .meter-container {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 14px;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: #2ea043;
            transition: width 0.05s ease;
        }
        .peers-list {
            margin-top: 16px;
            font-size: 12px;
            color: #8b949e;
            text-align: left;
            max-height: 140px;
            overflow-y: auto;
        }
        .peer-item {
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
        }
    </style>
    <!-- LiveKit Official Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>

<div class="card" id="app">
    <div class="badge">LiveKit Cloud SFU</div>
    <h1>Octane 3D Войс</h1>
    <p class="subtitle" id="subTitle">Введите 4-значный код из чата игры (/voice)</p>

    <!-- Ввод кода -->
    <div id="joinSection">
        <div class="input-group">
            <input type="text" id="codeInput" maxlength="4" placeholder="••••" autofocus inputmode="numeric">
        </div>
        <button class="btn btn-primary" id="connectBtn">Подключиться</button>
    </div>

    <!-- Активный войс -->
    <div id="voiceSection" style="display: none;">
        <div class="status-panel">
            <div class="status-row">
                <span>Статус:</span>
                <span><span class="indicator active" id="netIndicator"></span><b id="statusLabel">LiveKit Онлайн</b></span>
            </div>
            <div class="status-row">
                <span>Игрок:</span>
                <span id="playerLabel">-</span>
            </div>
            <div class="status-row">
                <span>В эфире:</span>
                <span id="peerCountLabel">0</span>
            </div>
        </div>

        <div class="meter-container">
            <div class="meter-fill" id="micMeter"></div>
        </div>

        <button class="btn btn-mute" id="muteBtn">Микрофон: ВКЛ</button>

        <div class="peers-list" id="peersList"></div>
    </div>
</div>

<script src="/client.js"></script>
</body>
</html>
