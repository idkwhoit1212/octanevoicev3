<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Octane 3D Positional Voice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #0d1117;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            text-align: center;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #238636;
            color: #ffffff;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 21px;
            margin-bottom: 6px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 22px;
        }
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #8b949e;
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #58a6ff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary {
            background: #238636;
            color: white;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-mute {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            margin-top: 14px;
        }
        .btn-mute.muted {
            background: #da3633;
            border-color: #f85149;
        }
        .status-panel {
            margin-top: 18px;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #da3633;
            margin-right: 6px;
        }
        .indicator.active {
            background: #2ea043;
        }
        .meter-container {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 14px;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: #2ea043;
            transition: width 0.05s ease;
        }
        .peers-list {
            margin-top: 16px;
            font-size: 12px;
            color: #8b949e;
            text-align: left;
            max-height: 140px;
            overflow-y: auto;
        }
        .peer-item {
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
        }
    </style>
    <!-- jsrsasign для клиентской генерации JWT токена LiveKit -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.9.0/jsrsasign-all-min.js"></script>
    <!-- LiveKit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>

<div class="card">
    <div class="badge">Octane 2021 • GitHub Pages</div>
    <h1>3D Позиционный Войс</h1>
    <p class="subtitle" id="subTitle">Голосовой чат на базе LiveKit Cloud</p>

    <!-- Форма входа -->
    <div id="joinSection">
        <div class="input-group">
            <label for="usernameInput">Ваш никнейм в Roblox:</label>
            <input type="text" id="usernameInput" placeholder="Например: Mellstr0y" autofocus>
        </div>
        <div class="input-group">
            <label for="roomInput">Номер комнаты (сервера):</label>
            <input type="text" id="roomInput" value="octane_main">
        </div>
        <button class="btn btn-primary" id="connectBtn">Войти в войс</button>
    </div>

    <!-- Панель активного войса -->
    <div id="voiceSection" style="display: none;">
        <div class="status-panel">
            <div class="status-row">
                <span>Статус:</span>
                <span><span class="indicator active" id="netIndicator"></span><b id="statusLabel">В эфире LiveKit</b></span>
            </div>
            <div class="status-row">
                <span>Игрок:</span>
                <span id="playerLabel">-</span>
            </div>
            <div class="status-row">
                <span>Комната:</span>
                <span id="roomLabel">-</span>
            </div>
            <div class="status-row">
                <span>Собеседников в сети:</span>
                <span id="peerCountLabel">0</span>
            </div>
        </div>

        <div class="meter-container">
            <div class="meter-fill" id="micMeter"></div>
        </div>

        <button class="btn btn-mute" id="muteBtn">Микрофон: ВКЛ</button>

        <div class="peers-list" id="peersList"></div>
    </div>
</div>

<script>
    // LiveKit Cloud Credentials
    const LIVEKIT_URL = "wss://octanevc-tzsmlvtk.livekit.cloud";
    const API_KEY = "APIznX5jQRcqBmK";
    const API_SECRET = "SrEexgvzH2uxK9PWaCdANc8lG3MP4GNP3gOrM7eu0E1";

    let currentRoom = null;
    let audioCtx = null;
    let isMuted = false;
    let localAnalyser = null;

    // Хранилище участников: identity -> { panner, gainNode, sourceNode, name }
    const audioNodes = new Map();

    const joinSection = document.getElementById('joinSection');
    const voiceSection = document.getElementById('voiceSection');
    const usernameInput = document.getElementById('usernameInput');
    const roomInput = document.getElementById('roomInput');
    const connectBtn = document.getElementById('connectBtn');
    const muteBtn = document.getElementById('muteBtn');
    const micMeter = document.getElementById('micMeter');
    const playerLabel = document.getElementById('playerLabel');
    const roomLabel = document.getElementById('roomLabel');
    const peerCountLabel = document.getElementById('peerCountLabel');
    const peersList = document.getElementById('peersList');
    const statusLabel = document.getElementById('statusLabel');

    // Проверяем параметры в URL ?user=Mellstr0y&room=octane_main
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('user')) usernameInput.value = urlParams.get('user');
    if (urlParams.get('room')) roomInput.value = urlParams.get('room');

    // Авто-вход, если переданы оба параметра
    if (urlParams.get('user') && urlParams.get('room')) {
        setTimeout(startConnection, 400);
    }

    connectBtn.addEventListener('click', startConnection);
    muteBtn.addEventListener('click', toggleMute);

    // Генерация JWT токена LiveKit прямо в браузере через jsrsasign
    function createLiveKitJWT(apiKey, apiSecret, roomName, identity, name) {
        const header = { alg: "HS256", typ: "JWT" };
        const now = Math.floor(Date.now() / 1000);
        const payload = {
            sub: identity,
            iss: apiKey,
            nbf: now - 5,
            exp: now + (6 * 3600), // 6 часов
            name: name || identity,
            video: {
                room: roomName,
                roomJoin: true,
                canPublish: true,
                canSubscribe: true,
                canPublishData: true
            }
        };

        const sHeader = JSON.stringify(header);
        const sPayload = JSON.stringify(payload);
        return KJUR.jws.JWS.sign("HS256", sHeader, sPayload, { utf8: apiSecret });
    }

    async function startConnection() {
        const username = usernameInput.value.trim();
        const roomName = roomInput.value.trim() || "octane_main";

        if (!username) {
            alert("Пожалуйста, введите ваш никнейм в Roblox!");
            return;
        }

        connectBtn.disabled = true;
        connectBtn.innerText = "Подключение...";

        try {
            // Инициализация Web Audio API
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            // Создаем токен LiveKit на клиенте
            const token = createLiveKitJWT(API_KEY, API_SECRET, roomName, username, username);

            // Создаем комнату LiveKit
            currentRoom = new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true,
                audioCaptureDefaults: {
                    autoGainControl: true,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });

            // Подключение входящего 3D звука
            currentRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
                if (track.kind === LivekitClient.Track.Kind.Audio) {
                    setupRemote3DAudio(participant, track);
                }
            });

            currentRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
                removeRemoteAudio(participant.identity);
            });

            currentRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                removeRemoteAudio(participant.identity);
                updatePeerListUI();
            });

            currentRoom.on(LivekitClient.RoomEvent.ParticipantConnected, () => {
                updatePeerListUI();
            });

            // Прием позиций через Data Channel LiveKit
            currentRoom.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
                try {
                    const str = new TextDecoder().decode(payload);
                    const data = JSON.parse(str);
                    if (data.type === "positions") {
                        update3DPositions(data.positions, username);
                    }
                } catch (e) {}
            });

            // Подключаемся к облаку LiveKit
            await currentRoom.connect(LIVEKIT_URL, token);

            // Включаем микрофон
            await currentRoom.localParticipant.setMicrophoneEnabled(true);

            // Настройка индикатора громкости
            const audioPub = currentRoom.localParticipant.getTrackPublication(LivekitClient.Track.Kind.Audio);
            if (audioPub && audioPub.track) {
                setupMicMeter(audioPub.track.mediaStreamTrack);
            }

            playerLabel.innerText = username;
            roomLabel.innerText = roomName;
            joinSection.style.display = 'none';
            voiceSection.style.display = 'block';
            updatePeerListUI();
        } catch (err) {
            console.error(err);
            alert("Ошибка подключения к LiveKit: " + err.message);
            connectBtn.disabled = false;
            connectBtn.innerText = "Войти в войс";
        }
    }

    function setupRemote3DAudio(participant, track) {
        const stream = new MediaStream([track.mediaStreamTrack]);
        const sourceNode = audioCtx.createMediaStreamSource(stream);

        // HRTF 3D PannerNode
        const panner = audioCtx.createPanner();
        panner.panningModel = 'HRTF';
        panner.distanceModel = 'inverse';
        panner.refDistance = 12;
        panner.maxDistance = 160;
        panner.rolloffFactor = 1.3;

        const gainNode = audioCtx.createGain();
        sourceNode.connect(panner);
        panner.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        audioNodes.set(participant.identity, {
            panner,
            gainNode,
            sourceNode,
            name: participant.name || participant.identity
        });

        updatePeerListUI();
    }

    function removeRemoteAudio(identity) {
        const node = audioNodes.get(identity);
        if (node) {
            node.sourceNode.disconnect();
            node.panner.disconnect();
            node.gainNode.disconnect();
            audioNodes.delete(identity);
        }
    }

    function update3DPositions(positions, myName) {
        if (!audioCtx) return;

        // Позиция меня
        const me = positions.find(p => p.name === myName);
        if (me) {
            const listener = audioCtx.listener;
            const now = audioCtx.currentTime;
            if (listener.positionX) {
                listener.positionX.setValueAtTime(me.x, now);
                listener.positionY.setValueAtTime(me.y, now);
                listener.positionZ.setValueAtTime(me.z, now);
                listener.forwardX.setValueAtTime(me.lookX, now);
                listener.forwardY.setValueAtTime(me.lookY, now);
                listener.forwardZ.setValueAtTime(me.lookZ, now);
            } else {
                listener.setPosition(me.x, me.y, me.z);
                listener.setOrientation(me.lookX, me.lookY, me.lookZ, 0, 1, 0);
            }
        }

        // Позиции других участников
        for (const p of positions) {
            if (p.name === myName) continue;
            const node = audioNodes.get(p.name);
            if (node && node.panner) {
                const now = audioCtx.currentTime;
                if (node.panner.positionX) {
                    node.panner.positionX.setValueAtTime(p.x, now);
                    node.panner.positionY.setValueAtTime(p.y, now);
                    node.panner.positionZ.setValueAtTime(p.z, now);
                } else {
                    node.panner.setPosition(p.x, p.y, p.z);
                }
            }
        }
    }

    async function toggleMute() {
        if (!currentRoom) return;
        isMuted = !isMuted;
        await currentRoom.localParticipant.setMicrophoneEnabled(!isMuted);

        if (isMuted) {
            muteBtn.classList.add('muted');
            muteBtn.innerText = 'Микрофон: ВЫКЛ (Muted)';
        } else {
            muteBtn.classList.remove('muted');
            muteBtn.innerText = 'Микрофон: ВКЛ';
        }
    }

    function setupMicMeter(mediaStreamTrack) {
        const stream = new MediaStream([mediaStreamTrack]);
        const micSource = audioCtx.createMediaStreamSource(stream);
        localAnalyser = audioCtx.createAnalyser();
        localAnalyser.fftSize = 256;
        micSource.connect(localAnalyser);

        const buffer = new Uint8Array(localAnalyser.frequencyBinCount);
        function checkVolume() {
            localAnalyser.getByteFrequencyData(buffer);
            let sum = 0;
            for (let i = 0; i < buffer.length; i++) sum += buffer[i];
            const avg = sum / buffer.length;
            const vol = isMuted ? 0 : Math.min(100, Math.round((avg / 128) * 100));
            micMeter.style.width = vol + '%';
            requestAnimationFrame(checkVolume);
        }
        requestAnimationFrame(checkVolume);
    }

    function updatePeerListUI() {
        if (!currentRoom) return;
        peerCountLabel.innerText = currentRoom.remoteParticipants.size;
        peersList.innerHTML = '';
        currentRoom.remoteParticipants.forEach((p) => {
            const div = document.createElement('div');
            div.className = 'peer-item';
            div.innerHTML = `<span>${p.name || p.identity}</span><span style="color:#2ea043">● 3D</span>`;
            peersList.appendChild(div);
        });
    }
</script>
</body>
</html>
