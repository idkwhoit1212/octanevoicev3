<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Octane 3D Positional Voice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #0d1117;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            text-align: center;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #238636;
            color: #ffffff;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 21px;
            margin-bottom: 6px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 22px;
        }
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #8b949e;
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #58a6ff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary {
            background: #238636;
            color: white;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-mute {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            margin-top: 14px;
        }
        .btn-mute.muted {
            background: #da3633;
            border-color: #f85149;
        }
        .status-panel {
            margin-top: 18px;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #da3633;
            margin-right: 6px;
        }
        .indicator.active {
            background: #2ea043;
        }
        .meter-container {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 14px;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: #2ea043;
            transition: width 0.05s ease;
        }
        .peers-list {
            margin-top: 16px;
            font-size: 12px;
            color: #8b949e;
            text-align: left;
            max-height: 140px;
            overflow-y: auto;
        }
        .peer-item {
            padding: 6px 0;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .peer-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .peer-mute-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .peer-mute-btn:hover {
            background: #30363d;
        }
        .peer-mute-btn.peer-muted {
            background: #da3633;
            border-color: #f85149;
            color: #fff;
        }
        #errorNotice {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(218, 54, 51, 0.2);
            border: 1px solid #da3633;
            color: #ff7b72;
            font-size: 12px;
            text-align: left;
            word-break: break-all;
        }
        #audioContainer {
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>

<div class="card">
    <div class="badge">Octane 2021 • 3D Voice</div>
    <h1>3D Positional Voice</h1>
    <p class="subtitle">Proximity Voice Chat for Octane</p>

    <!-- Join Form -->
    <div id="joinSection">
        <div class="input-group">
            <label for="usernameInput">Roblox Username:</label>
            <input type="text" id="usernameInput" placeholder="e.g. Mellstr0y" autofocus>
        </div>
        <div class="input-group">
            <label for="roomInput">Server Room:</label>
            <input type="text" id="roomInput" value="octane_main">
        </div>
        <button class="btn btn-primary" id="connectBtn">Connect to Voice</button>
        <div id="errorNotice"></div>
    </div>

    <!-- Active Voice Panel -->
    <div id="voiceSection" style="display: none;">
        <div class="status-panel">
            <div class="status-row">
                <span>Status:</span>
                <span><span class="indicator active" id="netIndicator"></span><b id="statusLabel">3D Voice Connected</b></span>
            </div>
            <div class="status-row">
                <span>Player:</span>
                <span id="playerLabel">-</span>
            </div>
            <div class="status-row">
                <span>Room:</span>
                <span id="roomLabel">-</span>
            </div>
            <div class="status-row">
                <span>Peers online:</span>
                <span id="peerCountLabel">0</span>
            </div>
        </div>

        <div class="meter-container">
            <div class="meter-fill" id="micMeter"></div>
        </div>

        <button class="btn btn-mute" id="muteBtn">Microphone: ON</button>

        <div class="peers-list" id="peersList"></div>
    </div>
</div>

<div id="audioContainer"></div>

<script>
    const LIVEKIT_URL = "wss://octanevc-tzsmlvtk.livekit.cloud";
    const API_KEY = "APIznX5jQRcqBmK";
    const API_SECRET = "SrEexgvzH2uxK9PWaCdANc8lG3MP4GNP3gOrM7eu0E1";

    let currentRoom = null;
    let audioCtx = null;
    let isMuted = false;
    let localAnalyser = null;
    
    const audioNodes = new Map();

    const joinSection = document.getElementById('joinSection');
    const voiceSection = document.getElementById('voiceSection');
    const usernameInput = document.getElementById('usernameInput');
    const roomInput = document.getElementById('roomInput');
    const connectBtn = document.getElementById('connectBtn');
    const muteBtn = document.getElementById('muteBtn');
    const micMeter = document.getElementById('micMeter');
    const playerLabel = document.getElementById('playerLabel');
    const roomLabel = document.getElementById('roomLabel');
    const peerCountLabel = document.getElementById('peerCountLabel');
    const peersList = document.getElementById('peersList');
    const statusLabel = document.getElementById('statusLabel');
    const errorNotice = document.getElementById('errorNotice');
    const audioContainer = document.getElementById('audioContainer');

    function showError(msg) {
        errorNotice.innerText = msg;
        errorNotice.style.display = 'block';
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('user')) usernameInput.value = urlParams.get('user');
    if (urlParams.get('room')) roomInput.value = urlParams.get('room');

    if (urlParams.get('user')) {
        connectBtn.innerText = "Click to Connect (" + urlParams.get('user') + ")";
    }

    connectBtn.addEventListener('click', startConnection);
    muteBtn.addEventListener('click', toggleMute);

    async function signJwtWebCrypto(apiKey, apiSecret, roomName, identity) {
        const header = { alg: "HS256", typ: "JWT" };
        const now = Math.floor(Date.now() / 1000);
        const payload = {
            sub: identity,
            iss: apiKey,
            nbf: now - 10,
            exp: now + (24 * 3600),
            name: identity,
            video: {
                room: roomName,
                roomJoin: true,
                canPublish: true,
                canSubscribe: true,
                canPublishData: true
            }
        };

        function base64url(str) {
            return btoa(unescape(encodeURIComponent(str)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function bufferToBase64Url(buf) {
            let binary = '';
            const bytes = new Uint8Array(buf);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        const encodedHeader = base64url(JSON.stringify(header));
        const encodedPayload = base64url(JSON.stringify(payload));
        const dataToSign = `${encodedHeader}.${encodedPayload}`;

        const enc = new TextEncoder();
        const key = await window.crypto.subtle.importKey(
            "raw",
            enc.encode(apiSecret),
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign"]
        );

        const signature = await window.crypto.subtle.sign("HMAC", key, enc.encode(dataToSign));
        const encodedSignature = bufferToBase64Url(signature);

        return `${dataToSign}.${encodedSignature}`;
    }

    async function startConnection() {
        errorNotice.style.display = 'none';
        const username = usernameInput.value.trim();
        const roomName = roomInput.value.trim() || "octane_main";

        if (!username) {
            showError("Please enter your Roblox username!");
            return;
        }

        connectBtn.disabled = true;
        connectBtn.innerText = "Connecting...";

        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx) {
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const token = await signJwtWebCrypto(API_KEY, API_SECRET, roomName, username);

            currentRoom = new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true,
                audioCaptureDefaults: {
                    autoGainControl: true,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });

            currentRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
                if (track.kind === LivekitClient.Track.Kind.Audio) {
                    setupRemote3DAudio(participant, track);
                }
            });

            currentRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
                removeRemoteAudio(participant.identity);
            });

            currentRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                removeRemoteAudio(participant.identity);
                updatePeerListUI();
            });

            currentRoom.on(LivekitClient.RoomEvent.ParticipantConnected, () => {
                updatePeerListUI();
            });

            // Прием команд и координат из Roblox игры
            currentRoom.on(LivekitClient.RoomEvent.DataReceived, (payload) => {
                try {
                    let str = new TextDecoder().decode(payload).trim();
                    let data;
                    try {
                        data = JSON.parse(str);
                    } catch (e) {
                        data = JSON.parse(atob(str));
                    }
                    if (data) {
                        if (data.type === "positions") {
                            update3DPositions(data.positions, username);
                        } else if (data.type === "toggle_mute") {
                            if (data.target === username || data.target === playerLabel.innerText) {
                                console.log("[Voice] Received toggle_mute from Roblox!");
                                toggleMute();
                            }
                        }
                    }
                } catch (err) {}
            });

            await currentRoom.connect(LIVEKIT_URL, token);
            await currentRoom.localParticipant.setMicrophoneEnabled(true);

            const audioPub = currentRoom.localParticipant.getTrackPublication(LivekitClient.Track.Kind.Audio);
            if (audioPub && audioPub.track) {
                setupMicMeter(audioPub.track.mediaStreamTrack, username);
            }

            playerLabel.innerText = username;
            roomLabel.innerText = roomName;
            joinSection.style.display = 'none';
            voiceSection.style.display = 'block';
            updatePeerListUI();
        } catch (err) {
            console.error("[Voice Error]", err);
            showError("Connection failed: " + (err.message || err));
            connectBtn.disabled = false;
            connectBtn.innerText = "Connect to Voice";
        }
    }

    function setupRemote3DAudio(participant, track) {
        if (!audioCtx) return;

        const audioEl = track.attach();
        audioEl.muted = true; // Глушим 2D стерео
        audioContainer.appendChild(audioEl);

        const stream = new MediaStream([track.mediaStreamTrack]);
        const sourceNode = audioCtx.createMediaStreamSource(stream);

        const panner = audioCtx.createPanner();
        panner.panningModel = 'HRTF';
        panner.distanceModel = 'inverse';
        panner.refDistance = 8;
        panner.maxDistance = 80;
        panner.rolloffFactor = 1.8;

        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 1.0;

        sourceNode.connect(panner);
        panner.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        audioNodes.set(participant.identity, {
            panner,
            gainNode,
            sourceNode,
            element: audioEl,
            isPeerMuted: false,
            name: participant.name || participant.identity
        });

        console.log("[3D Audio] Panner ready for:", participant.identity);
        updatePeerListUI();
    }

    function togglePeerMute(identity) {
        const node = audioNodes.get(identity);
        if (node && node.gainNode) {
            node.isPeerMuted = !node.isPeerMuted;
            node.gainNode.gain.value = node.isPeerMuted ? 0 : 1.0;
            updatePeerListUI();
        }
    }

    function removeRemoteAudio(identity) {
        const node = audioNodes.get(identity);
        if (node) {
            if (node.element) node.element.remove();
            if (node.sourceNode) node.sourceNode.disconnect();
            if (node.panner) node.panner.disconnect();
            if (node.gainNode) node.gainNode.disconnect();
            audioNodes.delete(identity);
        }
    }

    function update3DPositions(positions, myName) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        const me = positions.find(p => p.name === myName);
        if (me) {
            const listener = audioCtx.listener;
            if (listener.positionX) {
                listener.positionX.setValueAtTime(me.x, now);
                listener.positionY.setValueAtTime(me.y, now);
                listener.positionZ.setValueAtTime(me.z, now);
                listener.forwardX.setValueAtTime(me.lookX, now);
                listener.forwardY.setValueAtTime(me.lookY, now);
                listener.forwardZ.setValueAtTime(me.lookZ, now);
                listener.upX.setValueAtTime(0, now);
                listener.upY.setValueAtTime(1, now);
                listener.upZ.setValueAtTime(0, now);
            } else {
                listener.setPosition(me.x, me.y, me.z);
                listener.setOrientation(me.lookX, me.lookY, me.lookZ, 0, 1, 0);
            }
        }

        for (const p of positions) {
            if (p.name === myName) continue;
            const node = audioNodes.get(p.name);
            if (node && node.panner) {
                if (node.panner.positionX) {
                    node.panner.positionX.setValueAtTime(p.x, now);
                    node.panner.positionY.setValueAtTime(p.y, now);
                    node.panner.positionZ.setValueAtTime(p.z, now);
                } else {
                    node.panner.setPosition(p.x, p.y, p.z);
                }
            }
        }
    }

    async function toggleMute() {
        if (!currentRoom) return;
        isMuted = !isMuted;
        await currentRoom.localParticipant.setMicrophoneEnabled(!isMuted);

        if (isMuted) {
            muteBtn.classList.add('muted');
            muteBtn.innerText = 'Microphone: MUTED';
        } else {
            muteBtn.classList.remove('muted');
            muteBtn.innerText = 'Microphone: ON';
        }

        broadcastVolume(playerLabel.innerText, 0, isMuted);
    }

    function broadcastVolume(name, vol, muted) {
        if (!currentRoom || currentRoom.state !== 'connected') return;
        try {
            const payload = JSON.stringify({
                type: "user_volume",
                name: name,
                volume: vol,
                isMuted: muted
            });
            const data = new TextEncoder().encode(payload);
            currentRoom.localParticipant.publishData(data, { reliable: false });
        } catch (e) {}
    }

    function setupMicMeter(mediaStreamTrack, myUsername) {
        if (!audioCtx) return;
        const stream = new MediaStream([mediaStreamTrack]);
        const micSource = audioCtx.createMediaStreamSource(stream);
        localAnalyser = audioCtx.createAnalyser();
        localAnalyser.fftSize = 256;
        micSource.connect(localAnalyser);

        const buffer = new Uint8Array(localAnalyser.frequencyBinCount);
        let lastSendTime = 0;

        function checkVolume() {
            localAnalyser.getByteFrequencyData(buffer);
            let sum = 0;
            for (let i = 0; i < buffer.length; i++) sum += buffer[i];
            const avg = sum / buffer.length;
            
            let vol = 0;
            if (!isMuted && avg >= 5) {
                vol = Math.min(100, Math.round((avg / 80) * 100));
            }

            micMeter.style.width = vol + '%';

            const now = Date.now();
            if (now - lastSendTime >= 100) {
                lastSendTime = now;
                broadcastVolume(myUsername, vol, isMuted);
            }

            requestAnimationFrame(checkVolume);
        }
        requestAnimationFrame(checkVolume);
    }

    function updatePeerListUI() {
        if (!currentRoom) return;
        peerCountLabel.innerText = currentRoom.remoteParticipants.size;
        peersList.innerHTML = '';
        currentRoom.remoteParticipants.forEach((p) => {
            const node = audioNodes.get(p.identity);
            const isPeerMuted = node ? node.isPeerMuted : false;

            const div = document.createElement('div');
            div.className = 'peer-item';
            div.innerHTML = `
                <span>${p.name || p.identity}</span>
                <div class="peer-actions">
                    <span style="color:#2ea043;font-size:11px">● 3D</span>
                    <button class="peer-mute-btn ${isPeerMuted ? 'peer-muted' : ''}" onclick="togglePeerMute('${p.identity}')">
                        ${isPeerMuted ? 'Unmute' : 'Mute'}
                    </button>
                </div>
            `;
            peersList.appendChild(div);
        });
    }

    window.togglePeerMute = togglePeerMute;
</script>
</body>
</html>
